version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: empeno_db
      MYSQL_USER: usuario_luna
      MYSQL_PASSWORD: password_seguro_123
      MYSQL_ROOT_PASSWORD: root_password_seguro
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"

  web:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    volumes:
      - .:/app
    ports:
      - "80:8000"
    environment:
      DB_HOST: db
      DB_USER: usuario_luna
      DB_PASSWORD: password_seguro_123
      DB_NAME: empeno_db
      SECRET_KEY: "cambia_esto_por_una_clave_secreta_muy_larga"
    depends_on:
      - db

volumes:
  mysql_data:
